name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check --no-cache src tests scripts

      - name: Ruff format check
        run: python -m ruff format --no-cache --check src tests scripts

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag two-stage-recommender:ci .

      - name: Verify container health
        run: |
          docker run -d --name recommender-test -p 8000:8000 two-stage-recommender:ci
          sleep 5
          docker logs recommender-test
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8000/health
          docker rm -f recommender-test
